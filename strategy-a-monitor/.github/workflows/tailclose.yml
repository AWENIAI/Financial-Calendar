name: A Share Tailclose Monitor

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
        working-directory: a-share-tailclose-monitor

      - name: Run monitor
        run: python src/run.py
        working-directory: a-share-tailclose-monitor

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tailclose-report
          path: a-share-tailclose-monitor/reports/
