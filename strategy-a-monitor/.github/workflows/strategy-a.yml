name: Strategy A Financial Calendar

on:
  schedule:
    # 15:10 Asia/Shanghai = 07:10 UTC
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strategy-a-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Strategy A
        run: python src/run.py
      - name: Commit state and result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strategy-a-monitor/state strategy-a-monitor/reports strategy-a-monitor/output
          git diff --cached --quiet || git commit -m "Run Strategy A"
          git push
