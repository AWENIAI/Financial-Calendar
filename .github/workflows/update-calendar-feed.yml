name: Update Risk Calendar Feed

on:
  schedule:
    # GitHub Actions schedule is not guaranteed to start exactly on time.
    # Run on weekdays at Beijing 17:00 after the China futures market has closed.
    # China public holidays are handled by the CFFEX script: if same-day IH/IF/IC/IM
    # data is unavailable, it leaves the position-watch file unchanged.
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Show trigger time
        run: |
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Beijing now: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Update CFFEX index futures position watch
        run: npm run update-cffex-position

      - name: Update US megacap earnings
        run: npm run update-earnings

      - name: Enrich released earnings analyses
        run: npm run update-released-earnings-analysis

      - name: Regenerate ICS files
        run: npm run generate

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update README change log
        if: steps.changes.outputs.changed == 'true'
        run: npm run log-update

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/calendar data/risk-events.json data/fixed-events-2026.json data/us-megacap-earnings.json data/cffex-position-watch.json README.md README.backup.md package.json scripts/risk-calendar
          git commit -m "chore: update risk calendar feed"
          git push

      - name: Setup Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
